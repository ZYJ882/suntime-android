name: Release

# 推送形如 v1.6.0 的 Git 标签时，自动创建 GitHub Release，
# 发布说明自动取自 CHANGELOG.md 中对应版本的段落（单一事实源）。
#
# 用法：
#   git tag v1.6.0
#   git push origin v1.6.0
#
# 前提：仓库在 GitHub，且 Settings → Actions → General 的
#      Workflow permissions 允许 "Read and write permissions"（或依赖下方 permissions 声明）。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            NOTES="详见 CHANGELOG.md。"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
