plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.suntime'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.suntime"
        minSdk 24
        targetSdk 34
        // 版本号遵循 SemVer 2.0.0 (X.Y.Z，各段可为多位数，禁止前导零/四段)；versionCode 推导：
        //   versionCode = X*10000000 + Y*10000 + Z  (X<215, Y<10000, Z<10000，多位数下仍严格递增、无碰撞)
        versionCode 10110003   // 1.11.3
        versionName "1.11.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        // 工程未使用 BuildConfig，关闭可少生成一个类，略微减小方法数与包体
        buildConfig false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
}
