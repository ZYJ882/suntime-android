plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.suntime'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.suntime"
        minSdk 24
        targetSdk 34
        // 版本号遵循 SemVer 2.0.0 (X.Y.Z，各段可为多位数，禁止前导零/四段)；versionCode 推导：
        //   versionCode = X*10000000 + Y*10000 + Z  (X<215, Y<10000, Z<10000，多位数下仍严格递增、无碰撞)
        versionCode 10006000   // 1.6.0
        versionName "1.6.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
